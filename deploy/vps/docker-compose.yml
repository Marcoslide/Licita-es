name: licita-es

x-backend: &backend
  build:
    context: ../..
  image: licita-es-backend:${LICITA_IMAGE_TAG:-staging}
  env_file:
    - ${LICITA_ENV_FILE:-.env}
  environment:
    BOLSA_DATABASE_PATH: /runtime/data/bolsa_licitacoes.db
    BOLSA_DOCUMENTS_PATH: /runtime/documents
  volumes:
    - /opt/licita-es/runtime/data:/runtime/data
    - /opt/licita-es/runtime/documents:/runtime/documents
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  networks:
    - internal
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  api:
    <<: *backend
    command: ["--db", "/runtime/data/bolsa_licitacoes.db", "serve-admin", "--host", "0.0.0.0", "--port", "8088"]
    ports:
      - "127.0.0.1:18120:8088"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  scheduler:
    <<: *backend
    command: ["--db", "/runtime/data/bolsa_licitacoes.db", "run-scheduler"]
    depends_on:
      api:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=1m
    volumes:
      - ../../index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:18121:8080"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  internal:
    name: licita-es-internal
    internal: true
